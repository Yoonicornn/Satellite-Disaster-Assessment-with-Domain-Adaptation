# Shared settings. The method files override only what they need.
# Change a value here and it changes for every run, so keep experiment-specific values
# on the command line instead:  --set run.seed=1

run:
  out_dir: runs               # every run lands in runs/<group>/<name>/
  group: null                 # null -> the method name
  name: null                  # null -> "seed<seed>_<YYYYmmdd-HHMMSS>"
  timestamp: true
  seed: 0                     # changes the model init and the data order, NEVER the split

data:
  crops_dir: crops/wind_64    # folder made by scripts/extract_crops.py
  max_black: 0.5              # drop crops more than this share of no-data pixels (0.06 % of them)
  batch_size: 128             # source batch; the target batch has the same size.
                              # CORAL estimates a bottleneck x bottleneck covariance from ONE
                              # batch, so a small batch makes that estimate mostly noise.
  workers: 2
  aug:                        # one draw of parameters, applied to BOTH the pre and post crop
    backend: torchvision      # torchvision (geometric only, the original) | albumentations
    hflip: true
    vflip: false              # overhead imagery has no canonical "up"
    rot90: true
    rotate_deg: 10.0
    scale: [0.9, 1.1]
    # photometric; needs backend: albumentations. Defaults below are all OFF, so the
    # torchvision settings above reproduce the earlier runs exactly.
    brightness_contrast: 0.0  # limit for both, e.g. 0.3
    hue_sat_val: [0.0, 0.0, 0.0]
    gamma: [100.0, 100.0]     # percent; (100,100) is a no-op
    blur_sigma: [0.0, 0.0]
    noise_std: [0.0, 0.0]
    dropout: 0.0              # p of CoarseDropout
    p_photo: 0.5              # p for each photometric transform

model:
  backbone: resnet34          # shared by the pre and post branch
  pretrained: true            # ImageNet weights
  fusion: concat_diff         # concat_diff -> [f_pre, f_post, f_post - f_pre] (1536)
                              # concat      -> [f_pre, f_post]                 (1024)
  bottleneck: 256             # size of z, the feature CORAL and DANN align. Held below
                              # data.batch_size so CORAL's covariance is not rank-starved.
  dropout: 0.3
  input_size: null            # null -> crops used at their native 64x64 (resnet).
                              # dinov2 needs a multiple of 14: 70, 126 or 224.
  vit_pool: cls+avg           # dinov2 only: cls | cls+avg
  trainable_blocks: -1        # -1 = whole encoder trains, 0 = frozen,
                              # n = only the last n blocks train

loss:
  class_weights: balanced     # balanced (1/f_c, ratio 19:1) | sqrt (ratio 4:1) | none

optim:
  name: adamw
  lr: 2.0e-4                  # new layers (paper 2's value: https://arxiv.org/html/2401.17271v1#S2)
  backbone_lr: 2.0e-5         # pretrained layers, 10x lower
  weight_decay: 1.0e-6
  epochs: 25
  scheduler: cosine           # cosine | step | none
  amp: true                   # mixed precision; ignored on CPU
  grad_clip: 0                # 0 = off
  early_stop: 0
  min_epochs: 0

method:
  name: baseline              # baseline | bn_only | coral | dann | oracle

eval:
  select_on: source_val       # the best epoch is chosen here, NEVER with target labels
  select_metric: macro_f1
  splits: [source_val, target_test, test]
  track_splits: [target_test]   # curves only, never used to select the best epoch -> give [] if we want to skip target test evaluation at every epoch
  save_predictions: true      # per-building CSV, used by the prediction figures

log:
  tensorboard: true
  progress: true
  every_n_steps: 50
  save_last_every_epoch: true # so --resume works after a Colab disconnect
