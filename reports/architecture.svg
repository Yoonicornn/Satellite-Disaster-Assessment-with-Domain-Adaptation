<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="660" viewBox="0 0 1020 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1020" height="660" fill="#ffffff"/>

  <text x="24" y="30" font-size="19" font-weight="bold" fill="#0f172a">Building damage classification with domain adaptation</text>
  <text x="24" y="52" font-size="13" fill="#475569">Shared-weight (siamese) ResNet-34 on pre/post building crops. The encoder is the same for every method; only the loss changes.</text>

  <!-- ================= ENCODER BAND ================= -->
  <rect x="14" y="70" width="992" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="26" y="88" font-size="11" font-weight="bold" fill="#64748b">SHARED ENCODER (same for baseline, CORAL, DANN)</text>

  <!-- inputs -->
  <rect x="26" y="100" width="112" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="82" y="123" font-size="13" text-anchor="middle" fill="#0f172a">Pre crop</text>
  <text x="82" y="140" font-size="11" text-anchor="middle" fill="#475569">3 x 128 x 128</text>

  <rect x="26" y="192" width="112" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="82" y="215" font-size="13" text-anchor="middle" fill="#0f172a">Post crop</text>
  <text x="82" y="232" font-size="11" text-anchor="middle" fill="#475569">3 x 128 x 128</text>

  <!-- backbones -->
  <rect x="168" y="98" width="146" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="241" y="122" font-size="13" text-anchor="middle" fill="#0f172a">ResNet-34</text>
  <text x="241" y="139" font-size="11" text-anchor="middle" fill="#475569">ImageNet weights</text>

  <rect x="168" y="190" width="146" height="60" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="241" y="214" font-size="13" text-anchor="middle" fill="#0f172a">ResNet-34</text>
  <text x="241" y="231" font-size="11" text-anchor="middle" fill="#475569">ImageNet weights</text>

  <line x1="241" y1="158" x2="241" y2="190" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="250" y="178" font-size="11" fill="#2563eb">shared weights</text>

  <!-- pooling / features -->
  <rect x="344" y="104" width="116" height="48" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="402" y="124" font-size="12" text-anchor="middle" fill="#0f172a">pool -&gt; f_pre</text>
  <text x="402" y="140" font-size="11" text-anchor="middle" fill="#475569">512</text>

  <rect x="344" y="196" width="116" height="48" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="402" y="216" font-size="12" text-anchor="middle" fill="#0f172a">pool -&gt; f_post</text>
  <text x="402" y="232" font-size="11" text-anchor="middle" fill="#475569">512</text>

  <!-- concat -->
  <rect x="492" y="118" width="142" height="112" rx="6" fill="#e0f2fe" stroke="#0ea5e9"/>
  <text x="563" y="141" font-size="13" text-anchor="middle" fill="#0f172a">concat</text>
  <text x="563" y="161" font-size="11" text-anchor="middle" fill="#475569">[ f_pre,</text>
  <text x="563" y="177" font-size="11" text-anchor="middle" fill="#475569">f_post,</text>
  <text x="563" y="193" font-size="11" text-anchor="middle" fill="#475569">f_post - f_pre ]</text>
  <text x="563" y="216" font-size="12" text-anchor="middle" font-weight="bold" fill="#0f172a">1536</text>

  <!-- bottleneck -->
  <rect x="666" y="134" width="150" height="80" rx="6" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="741" y="158" font-size="12" text-anchor="middle" fill="#0f172a">FC 1536 -&gt; 512</text>
  <text x="741" y="176" font-size="11" text-anchor="middle" fill="#475569">ReLU + Dropout</text>
  <text x="741" y="196" font-size="11" text-anchor="middle" fill="#475569">(bottleneck)</text>

  <!-- z -->
  <rect x="848" y="144" width="132" height="62" rx="24" fill="#1e293b" stroke="#0f172a"/>
  <text x="914" y="170" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff">features z</text>
  <text x="914" y="189" font-size="11" text-anchor="middle" fill="#cbd5e1">512</text>

  <!-- encoder arrows -->
  <line x1="138" y1="128" x2="166" y2="128" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="138" y1="220" x2="166" y2="220" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="314" y1="128" x2="342" y2="128" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="314" y1="220" x2="342" y2="220" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 460 128 L 476 128 L 476 160 L 490 160" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <path d="M 460 220 L 476 220 L 476 190 L 490 190" fill="none" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="634" y1="174" x2="664" y2="174" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="816" y1="174" x2="846" y2="174" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- bus from z down to the three heads -->
  <path d="M 914 206 L 914 300 L 160 300" fill="none" stroke="#475569" stroke-width="1.6"/>
  <line x1="160" y1="300" x2="160" y2="352" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="500" y1="300" x2="500" y2="352" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="820" y1="300" x2="820" y2="352" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>

  <!-- ================= HEADS ================= -->
  <!-- classifier -->
  <rect x="40" y="354" width="240" height="74" rx="6" fill="#dcfce7" stroke="#22c55e"/>
  <text x="160" y="380" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a">Classifier head</text>
  <text x="160" y="400" font-size="11" text-anchor="middle" fill="#475569">FC 512 -&gt; 4 damage classes</text>
  <text x="160" y="417" font-size="11" text-anchor="middle" fill="#475569">source batch only</text>

  <line x1="160" y1="428" x2="160" y2="466" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="40" y="468" width="240" height="62" rx="6" fill="#f0fdf4" stroke="#22c55e"/>
  <text x="160" y="492" font-size="12" text-anchor="middle" fill="#0f172a">Weighted cross-entropy</text>
  <text x="160" y="511" font-size="11" text-anchor="middle" fill="#475569">L_cls  (uses source labels)</text>
  <text x="160" y="552" font-size="11" text-anchor="middle" font-style="italic" fill="#15803d">used by every method</text>

  <!-- CORAL -->
  <rect x="380" y="354" width="240" height="74" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="500" y="380" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a">CORAL branch</text>
  <text x="500" y="400" font-size="11" text-anchor="middle" fill="#475569">covariance of z, source vs target</text>
  <text x="500" y="417" font-size="11" text-anchor="middle" fill="#475569">no new parameters</text>

  <line x1="500" y1="428" x2="500" y2="466" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="380" y="468" width="240" height="62" rx="6" fill="#fffbeb" stroke="#f59e0b"/>
  <text x="500" y="492" font-size="12" text-anchor="middle" fill="#0f172a">L_coral = ||C_s - C_t||_F^2 / (4 d^2)</text>
  <text x="500" y="511" font-size="11" text-anchor="middle" fill="#475569">total: L_cls + lambda * L_coral</text>
  <text x="500" y="552" font-size="11" text-anchor="middle" font-style="italic" fill="#b45309">CORAL run only</text>

  <!-- DANN -->
  <rect x="700" y="354" width="240" height="74" rx="6" fill="#ede9fe" stroke="#8b5cf6"/>
  <text x="820" y="380" font-size="13" text-anchor="middle" font-weight="bold" fill="#0f172a">GRL -&gt; domain discriminator</text>
  <text x="820" y="400" font-size="11" text-anchor="middle" fill="#475569">reverse gradient, then 512 -&gt; 256 -&gt; 2</text>
  <text x="820" y="417" font-size="11" text-anchor="middle" fill="#475569">source and target batch</text>

  <line x1="820" y1="428" x2="820" y2="466" stroke="#475569" stroke-width="1.6" marker-end="url(#arrow)"/>
  <rect x="700" y="468" width="240" height="62" rx="6" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="820" y="492" font-size="12" text-anchor="middle" fill="#0f172a">L_domain (source vs target)</text>
  <text x="820" y="511" font-size="11" text-anchor="middle" fill="#475569">total: L_cls + lambda_p * L_domain</text>
  <text x="820" y="552" font-size="11" text-anchor="middle" font-style="italic" fill="#6d28d9">DANN run only</text>

  <!-- note -->
  <rect x="40" y="578" width="900" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="56" y="600" font-size="11.5" fill="#334155">For CORAL and DANN, every training step takes one labelled source batch and one unlabelled target batch. Both go through the same encoder.</text>
  <text x="56" y="620" font-size="11.5" fill="#334155">Target damage labels are never used in the loss. They are only used at evaluation time to report the target scores.</text>
</svg>
